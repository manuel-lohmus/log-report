name: Question
description: Ask a question or request guidance
title: "[Question]: "
labels: ["question"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Need help using log-report? Ask here."
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "3.0.0"
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Be as specific as possible
      placeholder: "How do I map custom correlation IDs into ECS fields?"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Code snippet / config
      description: Optional minimal snippet
      render: js
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v20.11.1"