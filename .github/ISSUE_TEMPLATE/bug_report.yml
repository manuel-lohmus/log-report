name: Bug report
description: Report a problem in log-report
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a bug! Please fill in the details below."
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-check
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I can reproduce this with the latest release
          required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: e.g. 3.0.0
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`
      placeholder: "v20.11.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime / Package manager
      description: e.g. npm 10, pnpm 9, yarn 4 (if relevant)
      placeholder: "npm 10"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps or code snippet to reproduce the issue
      render: bash
      placeholder: |
        1. Set logReport.logMode = 'dev'
        2. Call log.trace('db.query', { sql: 'SELECT 1' })
        3. Observe incorrect output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      description: Paste JSON or text output (redact sensitive data)
      render: json
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: false